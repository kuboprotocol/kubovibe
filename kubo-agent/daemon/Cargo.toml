[package]
name = "kubo-agent"
version = "0.1.0"
edition = "2021"
description = "KUBO Local Agent — runs code on your own machine and bills AI actions to the KUBO credit ledger"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
directories = "5"
anyhow = "1"
notify = "6"

[[bin]]
name = "kubo-agent"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
