name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright (chromium, main suite)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node's built-in `cache: npm` already caches ~/.npm keyed on the
      # lockfile hash. Avoid a second actions/cache step on the same path —
      # it duplicates work, doubles cache storage and adds save/restore overhead.
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache hit/miss
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" = "true" ]; then
            echo "::notice title=npm cache (playwright)::HIT"
          else
            echo "::notice title=npm cache (playwright)::MISS"
          fi

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Playwright Chromium (with system libs)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (excluding split redirect-cache suites)
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npx playwright test --project=chromium --grep-invert "(hash preservation across cached 301|fuzz #)"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 14

  redirect-hash-suite:
    name: Redirect hash matrix (chromium)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install Playwright Chromium (with system libs)
        run: npx playwright install --with-deps chromium
      - name: Run hash-preservation matrix only
        run: npx playwright test --project=chromium e2e/canonical-domain-redirect-cache.spec.ts --grep "hash preservation across cached 301"
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-hash
          path: playwright-report/
          retention-days: 14

  redirect-fuzz-suite:
    name: Redirect fuzz suite (chromium)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Override in workflow_dispatch / repo vars to replay a specific seed run.
      FUZZ_SEED_BASE: ${{ vars.FUZZ_SEED_BASE || '12648430' }}
      FUZZ_COUNT: ${{ vars.FUZZ_COUNT || '12' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Install Playwright Chromium (with system libs)
        run: npx playwright install --with-deps chromium
      - name: Run fuzz suite (deterministic seeds)
        run: npx playwright test --project=chromium e2e/canonical-domain-redirect-cache.spec.ts --grep "fuzz #"
      - name: Upload Playwright report (with persisted fuzz seeds)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-fuzz
          path: playwright-report/
          retention-days: 30
      - name: Upload fuzz seed manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-seeds
          path: playwright-report/fuzz-seeds.json
          retention-days: 90
          if-no-files-found: warn

  redirect-cache-cross-browser:
    name: Redirect cache (${{ matrix.project }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-redirect-cache
            browser: firefox
          - project: webkit-redirect-cache
            browser: webkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run canonical-domain redirect cache spec (excluding fuzz)
        run: npx playwright test --project=${{ matrix.project }} e2e/canonical-domain-redirect-cache.spec.ts --grep-invert "fuzz #"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
