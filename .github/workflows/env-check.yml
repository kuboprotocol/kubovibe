name: env-check

# Validates that .env.example templates stay in sync and that the
# setup-env.sh script behaves correctly (copy, dry-run, validate).
#
# Exit codes from scripts/setup-env.sh (kept in sync with README §"Códigos de saída"):
#   0 success | 1 IO/precheck | 2 invalid flag | 3 validation failure

on:
  push:
    paths:
      - ".env.example"
      - "supabase/functions/.env.example"
      - "scripts/setup-env.sh"
      - "scripts/setup-env.test.sh"
      - ".github/workflows/env-check.yml"
  pull_request:
    paths:
      - ".env.example"
      - "supabase/functions/.env.example"
      - "scripts/setup-env.sh"
      - "scripts/setup-env.test.sh"
      - ".github/workflows/env-check.yml"
  workflow_dispatch:

# Fail-fast: cancel in-flight runs on the same branch when a new commit lands.
concurrency:
  group: env-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # -e exits on first error, -u catches unset vars, pipefail surfaces piped failures.
    shell: bash -euo pipefail {0}

jobs:
  env-check:
    runs-on: ubuntu-latest
    # pull-requests: write → allows posting/updating the summary comment on PRs.
    permissions:
      contents: read
      pull-requests: write
    # Stop the whole job on the first failing step (fail-fast at workflow level).
    steps:
      - uses: actions/checkout@v4

      - name: Bash version (need >= 4)
        run: bash --version

      - name: Templates present
        run: |
          test -f .env.example
          test -f supabase/functions/.env.example

      - name: setup-env.sh --help (exit 0)
        run: bash scripts/setup-env.sh --help

      - name: setup-env.sh --dry-run (exit 0, no files written)
        run: |
          rm -f .env supabase/functions/.env
          bash scripts/setup-env.sh --dry-run
          test ! -f .env
          test ! -f supabase/functions/.env

      - name: Unknown flag → exit 2
        run: |
          set +e
          bash scripts/setup-env.sh --bogus
          code=$?
          set -e
          test "$code" -eq 2

      - name: Copy templates → exit 0, files exist
        run: |
          bash scripts/setup-env.sh
          test -f .env
          test -f supabase/functions/.env

      - name: --validate on freshly copied templates → exit 3 (placeholders)
        run: |
          set +e
          bash scripts/setup-env.sh --validate
          code=$?
          set -e
          test "$code" -eq 3

      - name: --validate after filling required vars → exit 0
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL="https://abcdefgh.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY="eyJrealtokenvalueforci.signedpayload.signature"
          VITE_SUPABASE_PROJECT_ID="abcdefgh"
          EOF
          cat > supabase/functions/.env <<'EOF'
          SUPABASE_URL="https://abcdefgh.supabase.co"
          SUPABASE_ANON_KEY="eyJrealanonkeyforci.signedpayload.signature"
          SUPABASE_SERVICE_ROLE_KEY="eyJrealsrkeyforci.signedpayload.signature"
          EOF
          bash scripts/setup-env.sh --validate --report --report-json

      - name: Validate JSON report shape
        run: |
          test -f reports/env-check.json
          node -e "const j=require('./reports/env-check.json'); if(j.status!=='pass')process.exit(1); if(!Array.isArray(j.entries)||j.entries.length<6)process.exit(2);"

      - name: Validate JSON report against schema
        run: |
          test -f reports/env-check.json
          test -f reports/env-check.schema.json
          node scripts/validate-env-report.mjs reports/env-check.json reports/env-check.schema.json

      - name: Upload env-check report (Markdown + JSON + schema)
        id: upload_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-check-report
          path: |
            reports/env-check.md
            reports/env-check.json
            reports/env-check.schema.json
          if-no-files-found: ignore

      - name: Print effective env (masked)
        run: bash scripts/setup-env.sh --print-effective --no-annotate

      - name: Build PR comment body
        if: always() && github.event_name == 'pull_request'
        env:
          REPORT_JSON_PATH: reports/env-check.json
          REPORT_MD_PATH:   reports/env-check.md
          # upload-artifact@v4 exposes `artifact-url` (direct .zip download link).
          ARTIFACT_URL: ${{ steps.upload_report.outputs.artifact-url }}
          RUN_URL:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL:     ${{ github.server_url }}/${{ github.repository }}
          RUN_ID:       ${{ github.run_id }}
          COMMIT_SHA:   ${{ github.event.pull_request.head.sha || github.sha }}
          OUT_PATH:     reports/pr-comment.md
        run: node scripts/build-env-check-pr-comment.mjs

      - name: Post / update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/pr-comment.md', 'utf8');
            const MARKER = '<!-- kubo:env-check -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Find existing comment with our marker to update in place.
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const prior = comments.find(c => c.body && c.body.includes(MARKER));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
              core.info(`Updated existing env-check comment #${prior.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created new env-check comment');
            }

      - name: Unit tests for setup-env.sh
        run: bash scripts/setup-env.test.sh

      - name: Prod health check (best-effort, non-blocking on forks)
        # Only run on main branch / push; PRs from forks lack secrets.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          PROD_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          PROD_SUPABASE_KEY: ${{ secrets.PROD_SUPABASE_KEY }}
        run: node scripts/prod-health-check.mjs
