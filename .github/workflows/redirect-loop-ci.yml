name: Redirect Loop Detection CI

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to test for redirect loops'
        required: false
        default: 'https://kubovibe-main.lovable.app'

jobs:
  redirect-check:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Redirect Loop E2E Test
        env:
          # Set the target URL for the test
          # If triggered by deployment_status, use the deployment URL
          # If triggered manually, use the input URL
          # Fallback to kubovibe-main.lovable.app
          BASE_URL: ${{ github.event.deployment_status.target_url || github.event.inputs.target_url || 'https://kubovibe-main.lovable.app' }}
        run: |
          echo "Testing URL: $BASE_URL"
          # We use a custom base URL for the E2E test
          PLAYWRIGHT_TEST_BASE_URL=$BASE_URL bun run e2e:redirect
