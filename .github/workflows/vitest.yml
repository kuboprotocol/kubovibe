name: Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vitest:
    name: Vitest (RTL redirect-flow + unit tests)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      JOB_LABEL: vitest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache (key + miss streak)
        uses: ./.github/actions/npm-cache-report
        with:
          job-label: ${{ env.JOB_LABEL }}
          cache-hit: ${{ steps.setup-node.outputs.cache-hit }}
          lockfile-hash: ${{ hashFiles('package-lock.json') }}
          node-version: "20"
          strict: ${{ vars.NPM_CACHE_STRICT || 'warn' }}
          max-misses: ${{ vars.NPM_CACHE_MAX_MISSES || '3' }}

      # Persistent Vite/Vitest caches: dependency pre-bundling and the
      # Vitest runner cache. Keyed on lockfile + config files so it is
      # invalidated only when deps or test config actually change.
      - name: Cache Vite/Vitest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .vite
            .vitest-cache
          key: ${{ runner.os }}-vite-vitest-${{ hashFiles('package-lock.json', 'vite.config.ts', 'vitest.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-vitest-

      - name: Install dependencies
        run: |
          echo "::group::[${JOB_LABEL}] npm ci"
          npm ci --prefer-offline --no-audit --fund=false
          echo "::endgroup::"

      - name: Run redirect-flow tests
        run: |
          echo "::group::[${JOB_LABEL}] redirect-flow tests"
          npx vitest run src/test/redirect-flow.test.tsx --reporter=verbose
          echo "::endgroup::"

      - name: Run full Vitest suite
        run: |
          echo "::group::[${JOB_LABEL}] full vitest suite"
          npm test -- --reporter=verbose
          echo "::endgroup::"
