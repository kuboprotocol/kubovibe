name: Vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vitest:
    name: Vitest (RTL redirect-flow + unit tests)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node + built-in npm cache (keyed on package-lock.json).
      # setup-node's built-in `cache: npm` already caches ~/.npm keyed on the
      # lockfile hash. A separate actions/cache step on the same path would
      # duplicate storage and add save/restore overhead with no real gain.
      - uses: actions/setup-node@v4
        id: setup-node
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report npm cache hit/miss
        run: |
          if [ "${{ steps.setup-node.outputs.cache-hit }}" = "true" ]; then
            echo "::notice title=npm cache::HIT (~/.npm restored from setup-node cache)"
          else
            echo "::notice title=npm cache::MISS (no cache restored — full download)"
          fi

      # Persistent Vite/Vitest caches: dependency pre-bundling and the
      # Vitest runner cache. Keyed on lockfile + config files so it is
      # invalidated only when deps or test config actually change.
      - name: Cache Vite/Vitest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
            node_modules/.vitest
            .vite
            .vitest-cache
          key: ${{ runner.os }}-vite-vitest-${{ hashFiles('package-lock.json', 'vite.config.ts', 'vitest.config.ts', 'tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-vitest-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run redirect-flow tests
        run: npx vitest run src/test/redirect-flow.test.tsx --reporter=verbose

      - name: Run full Vitest suite
        run: npm test -- --reporter=verbose
