name: Markdown Bullets CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Bullet Extraction Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: Run Tests with Coverage
        run: bunx vitest run src/test/markdown-bullets.test.ts --coverage
        
      - name: Upload Test Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullets-coverage-${{ github.event.pull_request.number || github.sha }}
          path: coverage/bullets/
          retention-days: 14

      - name: Upload JSON Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullets-json-results-${{ github.event.pull_request.number || github.sha }}
          path: test-results/
          retention-days: 14

