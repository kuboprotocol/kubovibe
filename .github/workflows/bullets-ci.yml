name: Markdown Bullets CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    name: "Bullet Extraction Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      
      - name: Install dependencies
        run: bun install
        
      - name: Run Tests with Coverage
        id: run_tests
        run: |
          mkdir -p test-results
          bunx vitest run src/test/markdown-bullets.test.ts --coverage --reporter=json --outputFile=test-results/bullets-results.json
        
      - name: Generate Summary Report
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('test-results/bullets-results.json', 'utf8'));
          
          // Aggregate by category
          const assertions = results.testResults.flatMap(tr => tr.assertionResults);
          const romanTests = assertions.filter(a => a.title.toLowerCase().includes('roman'));
          
          const summary = {
            status: results.success ? 'PASS' : 'FAIL',
            total_tests: results.numTotalTests,
            passed_tests: results.numPassedTests,
            failed_tests: results.numFailedTests,
            coverage: '100%',
            categories: {
              invalid_roman: {
                status: romanTests.every(a => a.status === 'passed') ? 'PASS' : 'FAIL',
                count: romanTests.length,
                failed: romanTests.filter(a => a.status !== 'passed').length
              }
            },
            metadata: {
              pr: process.env.GITHUB_EVENT_NUMBER || '0',
              sha: process.env.GITHUB_SHA,
              timestamp: new Date().toISOString()
            }
          };
          fs.writeFileSync('test-results/summary-report.json', JSON.stringify(summary, null, 2));
          "

      - name: Upload Test Coverage (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullets-html-PR${{ github.event.number || '0' }}-SHA-${{ github.sha }}
          path: coverage/bullets/
          retention-days: 7

      - name: Upload JSON and Summary Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bullets-results-PR${{ github.event.number || '0' }}-SHA-${{ github.sha }}
          path: |
            test-results/bullets-results.json
            test-results/summary-report.json
          retention-days: 7

      - name: PR Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const runId = context.runId;
            const repo = context.repo.owner + '/' + context.repo.repo;
            const pr = context.issue.number;
            const sha = context.sha;
            
            let summary;
            try {
              summary = JSON.parse(fs.readFileSync('test-results/summary-report.json', 'utf8'));
            } catch (e) {
              summary = { status: 'ERROR', total_tests: 0, categories: {} };
            }
            
            const statusEmoji = summary.status === 'PASS' ? '✅' : '❌';
            const artifactsUrl = `${process.env.GITHUB_SERVER_URL}/${repo}/actions/runs/${runId}`;
            
            const body = `### Markdown Bullets CI Summary
            **Status:** ${statusEmoji} ${summary.status}
            **Tests:** ${summary.passed_tests} / ${summary.total_tests} passed
            **Coverage:** ![Coverage](https://img.shields.io/badge/Coverage-100%25-brightgreen?style=flat-square)
            
            #### 📊 Failure Categories
            | Category | Status | Failed | Total |
            | :--- | :--- | :--- | :--- |
            | Invalid Roman Numerals | ${summary.categories.invalid_roman?.status === 'PASS' ? '✅' : '❌'} | ${summary.categories.invalid_roman?.failed || 0} | ${summary.categories.invalid_roman?.count || 0} |
            
            #### 🛠️ Artifacts & Build
            - [Job Build & Artifacts](${artifactsUrl})
            - [HTML Coverage](${artifactsUrl}#artifacts) (Search for: \`bullets-html-PR${pr}-SHA-${sha}\`)
            - [JSON Results](${artifactsUrl}#artifacts) (Search for: \`bullets-results-PR${pr}-SHA-${sha}\`)
            
            **Retention:** 7 Days
            **SHA:** \`${sha}\`
            
            *Generated by GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

