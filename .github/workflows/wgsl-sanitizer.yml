name: WGSL Sanitizer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wgsl-sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------
  # Integration tests — one job per pipeline stage.
  # Each test is tagged with [vertex] / [fragment] / [compute] / [shared]
  # in its name, so --filter selects only that stage.
  # ----------------------------------------------------------------------
  integration:
    name: Integration / ${{ matrix.stage }} / deno-${{ matrix.deno-version }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [vertex, fragment, compute, shared]
        deno-version: ["v1.x", "v2.x", "canary"]
        include:
          - deno-version: "v1.x"
            primary: true
          - deno-version: "v2.x"
            primary: false
          - deno-version: "canary"
            primary: false
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      DENO_DIR: ${{ github.workspace }}/.deno-cache
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.deno-cache
          key: deno-${{ runner.os }}-${{ matrix.deno-version }}-integration-${{ hashFiles('supabase/functions/wgsl-sanitizer/**/*.ts', 'supabase/functions/_shared/**/*.ts', 'deno.json', 'deno.jsonc', 'import_map.json') }}
          restore-keys: |
            deno-${{ runner.os }}-${{ matrix.deno-version }}-integration-
            deno-${{ runner.os }}-${{ matrix.deno-version }}-

      - name: Print Deno version
        run: deno --version

      - name: Warm Deno cache
        run: |
          deno cache --no-check \
            supabase/functions/wgsl-sanitizer/index.ts \
            supabase/functions/wgsl-sanitizer/index_test.ts

      - name: Run integration tests [${{ matrix.stage }}] on deno ${{ matrix.deno-version }}
        id: run_tests
        run: |
          mkdir -p logs
          LOG_FILE="logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::group::wgsl-sanitizer integration tests — stage=${{ matrix.stage }} deno=${{ matrix.deno-version }}"
          set -o pipefail
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            --no-check \
            --coverage=coverage/integration-${{ matrix.stage }}-${{ matrix.deno-version }} \
            --filter="[${{ matrix.stage }}]" \
            supabase/functions/wgsl-sanitizer/index_test.ts 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          echo "::endgroup::"
          exit $STATUS

      - name: Surface failure logs
        if: failure()
        run: |
          LOG_FILE="logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::error title=Integration ${{ matrix.stage }} failed on deno ${{ matrix.deno-version }}::See log tail below"
          {
            echo "## ❌ Integration / ${{ matrix.stage }} / deno-${{ matrix.deno-version }} failed"
            echo ""
            echo '<details><summary>Last 200 log lines</summary>'
            echo ""
            echo '```'
            tail -n 200 "$LOG_FILE" || echo "(no log captured)"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-integration-${{ matrix.stage }}-${{ matrix.deno-version }}
          path: logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload integration coverage [${{ matrix.stage }}]
        if: always() && matrix.primary == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.stage }}
          path: coverage/integration-${{ matrix.stage }}-${{ matrix.deno-version }}
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Fuzz tests — matrix over stage × Deno version.
  # ----------------------------------------------------------------------
  fuzz:
    name: Fuzz / ${{ matrix.stage }} / deno-${{ matrix.deno-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [vertex, fragment, compute, shared]
        deno-version: ["v1.x", "v2.x", "canary"]
        include:
          - deno-version: "v1.x"
            primary: true
          - deno-version: "v2.x"
            primary: false
          - deno-version: "canary"
            primary: false
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Print Deno version
        run: deno --version

      - name: Run fuzz tests [${{ matrix.stage }}] on deno ${{ matrix.deno-version }}
        run: |
          mkdir -p logs
          LOG_FILE="logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::group::wgsl-sanitizer fuzz tests — stage=${{ matrix.stage }} deno=${{ matrix.deno-version }}"
          set -o pipefail
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            --no-check \
            --coverage=coverage/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }} \
            --filter="[${{ matrix.stage }}]" \
            supabase/functions/wgsl-sanitizer/fuzz_test.ts 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          echo "::endgroup::"
          exit $STATUS

      - name: Surface failure logs
        if: failure()
        run: |
          LOG_FILE="logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::error title=Fuzz ${{ matrix.stage }} failed on deno ${{ matrix.deno-version }}::See log tail below"
          {
            echo "## ❌ Fuzz / ${{ matrix.stage }} / deno-${{ matrix.deno-version }} failed"
            echo ""
            echo '<details><summary>Last 200 log lines</summary>'
            echo ""
            echo '```'
            tail -n 200 "$LOG_FILE" || echo "(no log captured)"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}
          path: logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload fuzz coverage [${{ matrix.stage }}]
        if: always() && matrix.primary == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fuzz-${{ matrix.stage }}
          path: coverage/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Coverage aggregation — combines per-stage coverage and publishes PR comment.
  # ----------------------------------------------------------------------
  coverage-report:
    name: Coverage Report
    needs: [integration, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Download integration coverage artifacts (per stage)
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts/integration
          pattern: coverage-integration-*
          merge-multiple: false
        continue-on-error: true

      - name: Download fuzz coverage artifacts (per stage)
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts/fuzz
          pattern: coverage-fuzz-*
          merge-multiple: false
        continue-on-error: true

      - name: Generate combined coverage report
        id: coverage
        run: |
          set -euo pipefail
          INCLUDE='supabase/functions/wgsl-sanitizer/'
          EXCLUDE='_test\.ts|fuzz_test\.ts'
          STAGES=(vertex fragment compute shared)
          KINDS=(integration fuzz)

          mkdir -p coverage/combined per-stage-lcov

          # ----- Per-stage coverage computation -----
          declare -A STAGE_PCT STAGE_LH STAGE_LF
          for kind in "${KINDS[@]}"; do
            for stage in "${STAGES[@]}"; do
              key="${kind}-${stage}"
              src="coverage-artifacts/${kind}/coverage-${kind}-${stage}"
              dst="coverage/per-stage/${key}"
              mkdir -p "$dst"
              if [ -d "$src" ]; then
                # Flatten raw coverage profile files (*.json) into the per-stage dir
                find "$src" -type f -name '*.json' -exec cp {} "$dst/" \; 2>/dev/null || true
                # Also feed the combined pool used for the overall total
                find "$src" -type f -name '*.json' -exec cp {} coverage/combined/ \; 2>/dev/null || true
              fi

              if [ -n "$(ls -A "$dst" 2>/dev/null)" ]; then
                lcov_file="per-stage-lcov/${key}.lcov"
                deno coverage "$dst" --include="$INCLUDE" --exclude="$EXCLUDE" --lcov --output="$lcov_file" || true
                if [ -s "$lcov_file" ]; then
                  lf=$(grep -E '^LF:' "$lcov_file" | awk -F: '{s+=$2} END {print s+0}')
                  lh=$(grep -E '^LH:' "$lcov_file" | awk -F: '{s+=$2} END {print s+0}')
                else
                  lf=0; lh=0
                fi
              else
                lf=0; lh=0
              fi

              STAGE_LF[$key]=$lf
              STAGE_LH[$key]=$lh
              if [ "$lf" -gt 0 ]; then
                STAGE_PCT[$key]=$(awk "BEGIN {printf \"%.2f\", ($lh/$lf)*100}")
              else
                STAGE_PCT[$key]="—"
              fi
            done
          done

          # ----- Combined total -----
          if [ -z "$(ls -A coverage/combined 2>/dev/null)" ]; then
            {
              echo "## WGSL Sanitizer — Coverage Report"
              echo ""
              echo "_No coverage data collected — all test jobs may have failed before producing coverage._"
            } | tee coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            : > coverage.lcov
            : > coverage-detailed.txt
            exit 0
          fi

          echo "::group::Detailed coverage"
          deno coverage coverage/combined --include="$INCLUDE" --exclude="$EXCLUDE" | tee coverage-detailed.txt
          echo "::endgroup::"

          deno coverage coverage/combined --include="$INCLUDE" --exclude="$EXCLUDE" --lcov --output=coverage.lcov

          LF=$(grep -E '^LF:' coverage.lcov | awk -F: '{s+=$2} END {print s+0}')
          LH=$(grep -E '^LH:' coverage.lcov | awk -F: '{s+=$2} END {print s+0}')
          if [ "$LF" -gt 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.2f\", ($LH/$LF)*100}")
          else
            PCT="0.00"
          fi

          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "🚫" ;;
              skipped) echo "⏭️" ;;
              *) echo "❔" ;;
            esac
          }
          INTEG_ICON=$(icon "${{ needs.integration.result }}")
          FUZZ_ICON=$(icon "${{ needs.fuzz.result }}")

          fmt_cell() {
            local key="$1"
            local pct="${STAGE_PCT[$key]}"
            local lh="${STAGE_LH[$key]}"
            local lf="${STAGE_LF[$key]}"
            if [ "$pct" = "—" ]; then
              echo "—"
            else
              echo "\`${pct}%\` (${lh}/${lf})"
            fi
          }

          {
            echo "## WGSL Sanitizer — Coverage Report"
            echo ""
            echo "**Total line coverage:** \`${PCT}%\` (${LH}/${LF} lines)"
            echo ""
            echo "Aggregated from per-stage artifacts: \`coverage-integration-{vertex,fragment,compute,shared}\` + \`coverage-fuzz-{...}\`."
            echo ""
            echo "### Coverage by stage"
            echo ""
            echo "| Stage | Integration | Fuzz |"
            echo "|-------|-------------|------|"
            for stage in "${STAGES[@]}"; do
              echo "| ${stage} | $(fmt_cell "integration-${stage}") | $(fmt_cell "fuzz-${stage}") |"
            done
            echo ""
            echo "### Job results"
            echo ""
            echo "- Integration matrix: ${INTEG_ICON} \`${{ needs.integration.result }}\`"
            echo "- Fuzz matrix: ${FUZZ_ICON} \`${{ needs.fuzz.result }}\`"
            echo ""
            echo "<sub>Per-stage pass/fail comes from the matrix jobs — open the Checks tab to see which stage broke.</sub>"
            echo ""
            echo "<details><summary>Per-file breakdown</summary>"
            echo ""
            echo '```'
            cat coverage-detailed.txt
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-summary.md

          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Highlight failing stages with job links
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fetch every job from this workflow run (paginated)
          gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            -q '.jobs[] | {name: .name, status: .status, conclusion: .conclusion, html_url: .html_url}' \
            > jobs.ndjson || echo "[]" > jobs.ndjson

          # Pick only failed Integration / Fuzz matrix jobs and parse stage out of the name
          # Job names look like: "Integration / vertex / deno-v1.x" or "Fuzz / compute / deno-v2.x"
          FAILED=$(jq -rs '
            map(select(.conclusion == "failure"
                       and (.name | test("^(Integration|Fuzz) / (vertex|fragment|compute|shared) /"))))
            | map({
                kind: (.name | capture("^(?<k>Integration|Fuzz)").k),
                stage: (.name | capture("/ (?<s>vertex|fragment|compute|shared) /").s),
                deno: (.name | capture("deno-(?<d>[^ ]+)$").d // "?"),
                url: .html_url,
                name: .name
              })
          ' jobs.ndjson)

          COUNT=$(echo "$FAILED" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            HIGHLIGHT=$'\n### ✅ All stages passed\n\nNo failing `Integration` or `Fuzz` matrix jobs detected for this run.\n'
          else
            # Collect distinct failed stages, ordered: vertex, fragment, compute, shared
            STAGES=$(echo "$FAILED" | jq -r '[.[].stage] | unique | .[]' | \
                     awk 'BEGIN{order["vertex"]=1;order["fragment"]=2;order["compute"]=3;order["shared"]=4} {print order[$0]"\t"$0}' | \
                     sort -n | cut -f2)

            STAGE_BADGES=""
            for s in $STAGES; do
              STAGE_BADGES="${STAGE_BADGES}\`${s}\` "
            done

            {
              echo ""
              echo "### ❌ Failing stages: ${STAGE_BADGES}"
              echo ""
              echo "| Stage | Kind | Deno | Job |"
              echo "|-------|------|------|-----|"
              echo "$FAILED" | jq -r '.[] | "| \(.stage) | \(.kind) | \(.deno) | [open job](\(.url)) |"'
              echo ""
              RUN_URL="${{ github.server_url }}/${REPO}/actions/runs/${RUN_ID}"
              echo "[View full workflow run](${RUN_URL})"
            } > stage-failures.md

            HIGHLIGHT=$(cat stage-failures.md)
          fi

          # Prepend highlight to the existing coverage-summary.md so it shows up at the top of the PR comment
          {
            head -n 1 coverage-summary.md
            printf '%s\n' "$HIGHLIGHT"
            tail -n +2 coverage-summary.md
          } > coverage-summary.new.md
          mv coverage-summary.new.md coverage-summary.md

          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"


      - name: Upload combined coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.lcov
            coverage-detailed.txt
            coverage-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: wgsl-sanitizer-coverage
          path: coverage-summary.md
