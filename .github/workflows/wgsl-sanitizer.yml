name: WGSL Sanitizer Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wgsl-sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------
  # Integration tests — one job per pipeline stage.
  # Each test is tagged with [vertex] / [fragment] / [compute] / [shared]
  # in its name, so --filter selects only that stage.
  # ----------------------------------------------------------------------
  integration:
    name: Integration / ${{ matrix.stage }} / deno-${{ matrix.deno-version }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [vertex, fragment, compute, shared]
        deno-version: ["v1.x", "v2.x", "canary"]
        include:
          - deno-version: "v1.x"
            primary: true
          - deno-version: "v2.x"
            primary: false
          - deno-version: "canary"
            primary: false
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Print Deno version
        run: deno --version

      - name: Run integration tests [${{ matrix.stage }}] on deno ${{ matrix.deno-version }}
        id: run_tests
        run: |
          mkdir -p logs
          LOG_FILE="logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::group::wgsl-sanitizer integration tests — stage=${{ matrix.stage }} deno=${{ matrix.deno-version }}"
          set -o pipefail
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            --no-check \
            --coverage=coverage/integration-${{ matrix.stage }}-${{ matrix.deno-version }} \
            --filter="[${{ matrix.stage }}]" \
            supabase/functions/wgsl-sanitizer/index_test.ts 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          echo "::endgroup::"
          exit $STATUS

      - name: Surface failure logs
        if: failure()
        run: |
          LOG_FILE="logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::error title=Integration ${{ matrix.stage }} failed on deno ${{ matrix.deno-version }}::See log tail below"
          {
            echo "## ❌ Integration / ${{ matrix.stage }} / deno-${{ matrix.deno-version }} failed"
            echo ""
            echo '<details><summary>Last 200 log lines</summary>'
            echo ""
            echo '```'
            tail -n 200 "$LOG_FILE" || echo "(no log captured)"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-integration-${{ matrix.stage }}-${{ matrix.deno-version }}
          path: logs/integration-${{ matrix.stage }}-${{ matrix.deno-version }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload integration coverage [${{ matrix.stage }}]
        if: always() && matrix.primary == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration-${{ matrix.stage }}
          path: coverage/integration-${{ matrix.stage }}-${{ matrix.deno-version }}
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Fuzz tests — matrix over stage × Deno version.
  # ----------------------------------------------------------------------
  fuzz:
    name: Fuzz / ${{ matrix.stage }} / deno-${{ matrix.deno-version }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [vertex, fragment, compute, shared]
        deno-version: ["v1.x", "v2.x", "canary"]
        include:
          - deno-version: "v1.x"
            primary: true
          - deno-version: "v2.x"
            primary: false
          - deno-version: "canary"
            primary: false
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ matrix.deno-version }}

      - name: Print Deno version
        run: deno --version

      - name: Run fuzz tests [${{ matrix.stage }}] on deno ${{ matrix.deno-version }}
        run: |
          mkdir -p logs
          LOG_FILE="logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::group::wgsl-sanitizer fuzz tests — stage=${{ matrix.stage }} deno=${{ matrix.deno-version }}"
          set -o pipefail
          deno test \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            --no-check \
            --coverage=coverage/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }} \
            --filter="[${{ matrix.stage }}]" \
            supabase/functions/wgsl-sanitizer/fuzz_test.ts 2>&1 | tee "$LOG_FILE"
          STATUS=${PIPESTATUS[0]}
          echo "::endgroup::"
          exit $STATUS

      - name: Surface failure logs
        if: failure()
        run: |
          LOG_FILE="logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log"
          echo "::error title=Fuzz ${{ matrix.stage }} failed on deno ${{ matrix.deno-version }}::See log tail below"
          {
            echo "## ❌ Fuzz / ${{ matrix.stage }} / deno-${{ matrix.deno-version }} failed"
            echo ""
            echo '<details><summary>Last 200 log lines</summary>'
            echo ""
            echo '```'
            tail -n 200 "$LOG_FILE" || echo "(no log captured)"
            echo '```'
            echo ""
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}
          path: logs/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload fuzz coverage [${{ matrix.stage }}]
        if: always() && matrix.primary == true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fuzz-${{ matrix.stage }}
          path: coverage/fuzz-${{ matrix.stage }}-${{ matrix.deno-version }}
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------
  # Coverage aggregation — combines per-stage coverage and publishes PR comment.
  # ----------------------------------------------------------------------
  coverage-report:
    name: Coverage Report
    needs: [integration, fuzz]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-artifacts
          pattern: coverage-*
        continue-on-error: true

      - name: Generate combined coverage report
        id: coverage
        run: |
          mkdir -p coverage/combined
          # Merge raw coverage files from every per-stage job
          if [ -d coverage-artifacts ]; then
            find coverage-artifacts -mindepth 2 -type f -exec cp {} coverage/combined/ \; 2>/dev/null || true
          fi

          INCLUDE='supabase/functions/wgsl-sanitizer/'

          if [ -z "$(ls -A coverage/combined 2>/dev/null)" ]; then
            echo "No coverage data collected (all test jobs may have failed before producing coverage)." | tee coverage-summary.md
            cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::group::Detailed coverage"
          deno coverage coverage/combined --include="$INCLUDE" --exclude='_test\.ts|fuzz_test\.ts' | tee coverage-detailed.txt
          echo "::endgroup::"

          deno coverage coverage/combined --include="$INCLUDE" --exclude='_test\.ts|fuzz_test\.ts' --lcov --output=coverage.lcov

          LF=$(grep -E '^LF:' coverage.lcov | awk -F: '{s+=$2} END {print s+0}')
          LH=$(grep -E '^LH:' coverage.lcov | awk -F: '{s+=$2} END {print s+0}')
          if [ "$LF" -gt 0 ]; then
            PCT=$(awk "BEGIN {printf \"%.2f\", ($LH/$LF)*100}")
          else
            PCT="0.00"
          fi

          {
            echo "## WGSL Sanitizer — Coverage Report"
            echo ""
            echo "**Total line coverage:** \`${PCT}%\` (${LH}/${LF} lines)"
            echo ""
            echo "### Stage results"
            echo ""
            echo "| Stage | Integration | Fuzz |"
            echo "|-------|-------------|------|"
            echo "| vertex   | ${{ needs.integration.result == 'success' && '✅' || '❌' }} | ${{ needs.fuzz.result == 'success' && '✅' || '❌' }} |"
            echo "| fragment | ${{ needs.integration.result == 'success' && '✅' || '❌' }} | ${{ needs.fuzz.result == 'success' && '✅' || '❌' }} |"
            echo "| compute  | ${{ needs.integration.result == 'success' && '✅' || '❌' }} | ${{ needs.fuzz.result == 'success' && '✅' || '❌' }} |"
            echo "| shared   | ${{ needs.integration.result == 'success' && '✅' || '❌' }} | ${{ needs.fuzz.result == 'success' && '✅' || '❌' }} |"
            echo ""
            echo "<sub>Stage-level pass/fail comes from the matrix jobs — open the Checks tab to see which stage broke.</sub>"
            echo ""
            echo "<details><summary>Per-file breakdown</summary>"
            echo ""
            echo '```'
            cat coverage-detailed.txt
            echo '```'
            echo ""
            echo "</details>"
          } > coverage-summary.md

          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.lcov
            coverage-detailed.txt
            coverage-summary.md
          retention-days: 30
          if-no-files-found: ignore

      - name: Publish coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: wgsl-sanitizer-coverage
          path: coverage-summary.md
