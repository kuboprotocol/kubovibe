name: Preflight CORS Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      category:
        description: 'Run only one category (origin | request-method | request-headers | all)'
        required: false
        default: 'all'
      fc_seed:
        description: 'Optional FC_SEED to reproduce a specific fast-check counterexample (request-method only)'
        required: false
        default: ''

# Allow PR comments + dedicated GitHub Check Runs (one per category).
permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: preflight-fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # One job per fuzz category. Each job:
  #  - Runs only the Deno --filter substrings owned by that category.
  #  - Uploads its OWN artifact (seeds + failures + log).
  #  - Publishes its OWN GitHub Check Run with details_url → its artifact.
  #  - Posts a sticky PR comment with a category-scoped header.
  # ─────────────────────────────────────────────────────────────────────
  preflight-fuzz:
    name: ${{ matrix.label }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: origin
            label: Preflight Fuzz — Origin
            check_name: Preflight CORS Fuzz / Origin
            sticky_header: preflight-fuzz-origin
            # No property-based fuzz exists for Origin yet — run the
            # deterministic OPTIONS-preflight Origin contract tests instead.
            filters: |
              Allow-Origin is exactly
              Vary: Origin and Access-Control-Expose-Headers MUST be absent
              cross-origin — no Allow-Credentials
          - id: request-method
            label: Preflight Fuzz — Request-Method
            check_name: Preflight CORS Fuzz / Request-Method
            sticky_header: preflight-fuzz-request-method
            # Covers: Method fuzz, manual-shrinker test, fast-check shrinker.
            filters: |
              property-based fuzzing of Access-Control-Request-Method
              fuzz with deterministic SHRINKING
              fast-check property-based SHRINKING
          - id: request-headers
            label: Preflight Fuzz — Request-Headers
            check_name: Preflight CORS Fuzz / Request-Headers
            sticky_header: preflight-fuzz-request-headers
            # NOTE: the fast-check property-based SHRINKING suite is shared with
            # request-method (it currently exercises Access-Control-Request-Method
            # arbitraries) but we re-run it here so that fc-seeds.json /
            # fc-failures.json are also produced for the request-headers job —
            # this keeps the artifact contract symmetric across categories and
            # lets the request-headers sticky summary embed the same inline
            # fast-check direct-download links.
            filters: |
              property-based fuzzing of Access-Control-Request-Headers
              fast-check property-based SHRINKING
    env:
      CATEGORY_ID: ${{ matrix.id }}
      CATEGORY_LABEL: ${{ matrix.label }}
      FUZZ_STATE_DIR: ${{ github.workspace }}/.rls-test-fuzz-state
      # Standardized artifact naming → easy GitHub UI search:
      #   preflight-fuzz-<category>-<file>-run<run_number>-<run_id>
      # The trailing run_id keeps names unique across re-runs (required by v4).
      ARTIFACT_NAME: preflight-fuzz-${{ matrix.id }}-bundle-run${{ github.run_number }}-${{ github.run_id }}
    steps:
      # Skip categories the user didn't request via workflow_dispatch.
      - name: Determine if this category should run
        id: gate
        run: |
          REQ="${{ github.event.inputs.category }}"
          if [ -z "$REQ" ] || [ "$REQ" = "all" ] || [ "$REQ" = "${CATEGORY_ID}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${CATEGORY_ID} (workflow_dispatch requested '${REQ}')"
          fi

      - name: Checkout
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Deno
        if: steps.gate.outputs.should_run == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      # Per-category cache so seeds/failures of one category never pollute another.
      - name: Restore persisted fuzz state (per category)
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.FUZZ_STATE_DIR }}
          key: preflight-fuzz-state-${{ matrix.id }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            preflight-fuzz-state-${{ matrix.id }}-${{ github.ref_name }}-
            preflight-fuzz-state-${{ matrix.id }}-main-
            preflight-fuzz-state-${{ matrix.id }}-

      - name: Prepare fuzz state dir
        if: steps.gate.outputs.should_run == 'true'
        run: |
          mkdir -p "$FUZZ_STATE_DIR"
          echo "Category: ${CATEGORY_ID}"
          for f in seeds.json failures.json fc-seeds.json fc-failures.json; do
            if [ -f "$FUZZ_STATE_DIR/$f" ]; then
              echo "  - $f: $(jq 'length' "$FUZZ_STATE_DIR/$f" 2>/dev/null || echo '?') entries"
            fi
          done

      - name: Synthesize .env for tests
        if: steps.gate.outputs.should_run == 'true'
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=https://ci-fuzz.example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY=ci-publishable-key
          SUPABASE_URL=https://ci-fuzz.example.supabase.co
          SUPABASE_ANON_KEY=ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY=ci-service-role-key
          RLS_TEST_SECRET=integration-test-secret
          EOF

      - name: Run ${{ matrix.label }}
        if: steps.gate.outputs.should_run == 'true'
        id: fuzz
        env:
          FC_SEED: ${{ github.event.inputs.fc_seed }}
        run: |
          set -o pipefail
          mkdir -p reports
          LOG=reports/fuzz-${CATEGORY_ID}.log
          : > "$LOG"

          # Read non-empty filter lines from the matrix into an array.
          mapfile -t FILTERS < <(printf '%s\n' "${{ matrix.filters }}" | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          echo "Filters for ${CATEGORY_ID}: ${FILTERS[*]}"

          overall=0
          for f in "${FILTERS[@]}"; do
            echo "::group::[${CATEGORY_ID}] deno test --filter \"${f}\""
            deno test \
              --allow-net \
              --allow-env \
              --allow-read \
              --allow-write \
              --no-check \
              --filter "${f}" \
              supabase/functions/rls-test-create-user/integration.test.ts \
              2>&1 | tee -a "$LOG"
            status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "${status}" != "0" ]; then overall="${status}"; fi
          done

          echo "exit_code=${overall}" >> "$GITHUB_OUTPUT"
          echo "log_file=${LOG}" >> "$GITHUB_OUTPUT"
          exit "${overall}"

      # Build the per-category Markdown summary (success or minimized failure).
      - name: Build category failure summary
        if: always() && steps.gate.outputs.should_run == 'true'
        id: summary
        run: |
          mkdir -p reports
          SUMMARY_FILE="reports/summary-${CATEGORY_ID}.md"
          LOG="${{ steps.fuzz.outputs.log_file }}"
          {
            echo "## 🧪 ${CATEGORY_LABEL} — Run #${{ github.run_number }}"
            echo ""
            echo "- Category: \`${CATEGORY_ID}\`"
            echo "- Workflow: \`${{ github.workflow }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo ""
            if [ "${{ steps.fuzz.outputs.exit_code }}" = "0" ]; then
              echo "✅ **All invariants held for ${CATEGORY_ID}.**"
            else
              echo "❌ **Invariant violation in ${CATEGORY_ID} fuzz.**"
              echo ""

              # Manual-shrinker payload (used by request-method category).
              if [ -f "$FUZZ_STATE_DIR/failures.json" ] && [ "$CATEGORY_ID" = "request-method" ]; then
                echo "### Minimized failing payload (manual shrinker)"
                echo ""
                echo '```'
                jq -r '
                  if length == 0 then "(no persisted failure on disk — see test log)"
                  else
                    .[-1] |
                    "Seed:            \(.seed)\n" +
                    "Index:           \(.index)\n" +
                    "Found at:        \(.foundAt)\n" +
                    "Original reason: \(.originalReason)\n" +
                    "Shrunk reason:   \(.shrunkReason)\n" +
                    "Shrink iters:    \(.shrinkIterations)\n" +
                    "\nORIGINAL payload:\n\(.original | tojson)\n" +
                    "\nSHRUNK payload:\n\(.shrunk | tojson)"
                  end
                ' "$FUZZ_STATE_DIR/failures.json" 2>/dev/null || echo "(failed to parse failures.json)"
                echo '```'
                echo ""
              fi

              # fast-check counterexample (request-method + request-headers).
              if [ -f "$FUZZ_STATE_DIR/fc-failures.json" ] && { [ "$CATEGORY_ID" = "request-method" ] || [ "$CATEGORY_ID" = "request-headers" ]; }; then
                echo "### fast-check minimized counterexample"
                echo ""
                echo '```'
                jq -r '
                  if length == 0 then "(fast-check: no persisted counterexample)"
                  else
                    .[-1] |
                    "Seed:            \(.seed)\n" +
                    "Marker:          \(.marker)\n" +
                    "Shrinks:         \(.numShrinks // 0)\n" +
                    "Original reason: \(.original.reason // "n/a")\n" +
                    "Original len:    \(.original.length // "n/a")\n" +
                    "Original method: \(.original.method // "n/a" | tojson)\n" +
                    "Shrunk reason:   \(.minimized.reason // "n/a")\n" +
                    "Shrunk len:      \(.minimized.length // "n/a")\n" +
                    "Shrunk method:   \(.minimized.method | tojson)\n" +
                    "Repro:           \(.reproCommand // "n/a")"
                  end
                ' "$FUZZ_STATE_DIR/fc-failures.json" 2>/dev/null || echo "(failed to parse fc-failures.json)"
                echo '```'
                echo ""
              fi

              echo "### Test log (last 80 lines)"
              echo ""
              echo '```'
              tail -n 80 "$LOG" 2>/dev/null || echo "(no log captured)"
              echo '```'
              echo ""
              echo "**To reproduce locally:**"
              echo '```bash'
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                echo "deno test --allow-net --allow-env --allow-read --allow-write \\"
                echo "  --filter \"${f}\" \\"
                echo "  supabase/functions/rls-test-create-user/integration.test.ts"
              done <<< "${{ matrix.filters }}"
              echo '```'
            fi
          } > "$SUMMARY_FILE"

          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "summary_file=${SUMMARY_FILE}" >> "$GITHUB_OUTPUT"

      # One artifact per category, scoped to its own seeds/failures/logs.
      - name: Upload ${{ matrix.id }} artifact
        if: always() && steps.gate.outputs.should_run == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.FUZZ_STATE_DIR }}/**
            reports/summary-${{ matrix.id }}.md
            reports/fuzz-${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 14

      # Stage per-file artifacts so each download contains exactly one file.
      # seeds.json / failures.json exist for ALL categories (manual fuzzers).
      # fc-seeds.json / fc-failures.json only exist for request-method.
      - name: Stage per-file artifacts (seeds, failures, log, fast-check)
        if: always() && steps.gate.outputs.should_run == 'true'
        id: stage
        run: |
          mkdir -p \
            reports/seeds reports/failures reports/log \
            reports/fc-seeds reports/fc-failures

          STAGED_SEEDS=0; STAGED_FAILS=0; STAGED_LOG=0
          STAGED_FC_SEEDS=0; STAGED_FC_FAILS=0

          if [ -f "$FUZZ_STATE_DIR/seeds.json" ]; then
            cp "$FUZZ_STATE_DIR/seeds.json" reports/seeds/seeds.json
            STAGED_SEEDS=1
          fi
          if [ -f "$FUZZ_STATE_DIR/failures.json" ]; then
            cp "$FUZZ_STATE_DIR/failures.json" reports/failures/failures.json
            STAGED_FAILS=1
          fi
          if [ -f "reports/fuzz-${CATEGORY_ID}.log" ]; then
            cp "reports/fuzz-${CATEGORY_ID}.log" "reports/log/fuzz-${CATEGORY_ID}.log"
            STAGED_LOG=1
          fi
          # fast-check seeds/failures are produced by the shared fast-check
          # SHRINKING suite. That suite now runs in BOTH request-method and
          # request-headers jobs (see matrix.filters), so we stage these files
          # for either category whenever the test actually wrote them.
          if [ "${CATEGORY_ID}" = "request-method" ] || [ "${CATEGORY_ID}" = "request-headers" ]; then
            if [ -f "$FUZZ_STATE_DIR/fc-seeds.json" ]; then
              cp "$FUZZ_STATE_DIR/fc-seeds.json" reports/fc-seeds/fc-seeds.json
              STAGED_FC_SEEDS=1
            fi
            if [ -f "$FUZZ_STATE_DIR/fc-failures.json" ]; then
              cp "$FUZZ_STATE_DIR/fc-failures.json" reports/fc-failures/fc-failures.json
              STAGED_FC_FAILS=1
            fi
          fi

          {
            echo "staged_seeds=${STAGED_SEEDS}"
            echo "staged_failures=${STAGED_FAILS}"
            echo "staged_log=${STAGED_LOG}"
            echo "staged_fc_seeds=${STAGED_FC_SEEDS}"
            echo "staged_fc_failures=${STAGED_FC_FAILS}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload seeds.json (per category)
        if: always() && steps.gate.outputs.should_run == 'true' && steps.stage.outputs.staged_seeds == '1'
        id: upload_seeds
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-seeds-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/seeds/seeds.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failures.json (per category)
        if: always() && steps.gate.outputs.should_run == 'true' && steps.stage.outputs.staged_failures == '1'
        id: upload_failures
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-failures-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/failures/failures.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fuzz log (per category)
        if: always() && steps.gate.outputs.should_run == 'true' && steps.stage.outputs.staged_log == '1'
        id: upload_log
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-log-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/log/fuzz-${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fc-seeds.json artifact
        if: always() && steps.gate.outputs.should_run == 'true' && steps.stage.outputs.staged_fc_seeds == '1'
        id: upload_fc_seeds
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-fc-seeds-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/fc-seeds/fc-seeds.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload fc-failures.json artifact
        if: always() && steps.gate.outputs.should_run == 'true' && steps.stage.outputs.staged_fc_failures == '1'
        id: upload_fc_failures
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-fc-failures-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/fc-failures/fc-failures.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Compute artifact links
        if: always() && steps.gate.outputs.should_run == 'true'
        id: links
        run: |
          ARTIFACT_URL="${{ steps.upload.outputs.artifact-url }}"
          SEEDS_URL="${{ steps.upload_seeds.outputs.artifact-url }}"
          FAILURES_URL="${{ steps.upload_failures.outputs.artifact-url }}"
          LOG_URL="${{ steps.upload_log.outputs.artifact-url }}"
          FC_SEEDS_URL="${{ steps.upload_fc_seeds.outputs.artifact-url }}"
          FC_FAILURES_URL="${{ steps.upload_fc_failures.outputs.artifact-url }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "${ARTIFACT_URL}" ]; then ARTIFACT_URL="${RUN_URL}#artifacts"; fi
          {
            echo "artifact_url=${ARTIFACT_URL}"
            echo "seeds_url=${SEEDS_URL}"
            echo "failures_url=${FAILURES_URL}"
            echo "log_url=${LOG_URL}"
            echo "fc_seeds_url=${FC_SEEDS_URL}"
            echo "fc_failures_url=${FC_FAILURES_URL}"
            echo "run_url=${RUN_URL}"
          } >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "### 📦 Direct downloads for \`${CATEGORY_ID}\`"
            echo "- [📥 Full bundle (\`${ARTIFACT_NAME}\`)](${ARTIFACT_URL})"
            [ -n "${SEEDS_URL}" ]        && echo "- [🌱 \`seeds.json\`](${SEEDS_URL})"
            [ -n "${FAILURES_URL}" ]     && echo "- [💥 \`failures.json\`](${FAILURES_URL})"
            [ -n "${LOG_URL}" ]          && echo "- [📜 \`fuzz-${CATEGORY_ID}.log\`](${LOG_URL})"
            [ -n "${FC_SEEDS_URL}" ]     && echo "- [🌱 \`fc-seeds.json\` (fast-check)](${FC_SEEDS_URL})"
            [ -n "${FC_FAILURES_URL}" ]  && echo "- [💥 \`fc-failures.json\` (fast-check minimized)](${FC_FAILURES_URL})"
            echo "- [🔗 Workflow run page](${RUN_URL})"
          } >> "${{ steps.summary.outputs.summary_file }}"

      # Append a fast-check-specific section with INLINE direct download links
      # right next to the contextual explanation, so reviewers reading the PR
      # comment / summary-<category>.md don't need to scroll to find them.
      # Runs for BOTH request-method and request-headers because the shared
      # fast-check SHRINKING suite produces fc-seeds/fc-failures in either job.
      - name: Append fast-check artifact links to summary
        if: always() && steps.gate.outputs.should_run == 'true' && (matrix.id == 'request-method' || matrix.id == 'request-headers')
        env:
          FC_SEEDS_URL: ${{ steps.links.outputs.fc_seeds_url }}
          FC_FAILURES_URL: ${{ steps.links.outputs.fc_failures_url }}
          SUMMARY_FILE: ${{ steps.summary.outputs.summary_file }}
          FC_HEADER_LABEL: ${{ matrix.id == 'request-method' && 'Access-Control-Request-Method' || 'Access-Control-Request-Headers' }}
        run: |
          {
            echo ""
            echo "### 🎯 fast-check direct downloads (${FC_HEADER_LABEL})"
            echo ""
            if [ -n "${FC_SEEDS_URL}" ]; then
              echo "- 🌱 **Seeds executed (last 50 runs):** [\`fc-seeds.json\`](${FC_SEEDS_URL})"
            else
              echo "- 🌱 \`fc-seeds.json\` — _(not produced in this run)_"
            fi
            if [ -n "${FC_FAILURES_URL}" ]; then
              echo "- 💥 **Minimized counterexamples (last 100):** [\`fc-failures.json\`](${FC_FAILURES_URL})"
            else
              echo "- 💥 \`fc-failures.json\` — _(no failures persisted in this run — invariants held)_"
            fi
            echo ""
            echo "_The two files above are uploaded as standalone GitHub artifacts so you can \`curl\` or download them without unpacking the full bundle._"
          } >> "${SUMMARY_FILE}"

          # Re-emit the augmented summary into the GitHub Actions UI panel.
          {
            echo ""
            echo "### 🎯 fast-check direct downloads (${FC_HEADER_LABEL})"
            [ -n "${FC_SEEDS_URL}" ]    && echo "- [fc-seeds.json](${FC_SEEDS_URL})"
            [ -n "${FC_FAILURES_URL}" ] && echo "- [fc-failures.json](${FC_FAILURES_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      # Self-test: assert the append step actually injected the inline
      # fc-seeds.json / fc-failures.json links into summary-<category>.md
      # (and the GITHUB_STEP_SUMMARY mirror) — but ONLY for the files that
      # were actually produced/staged in this job. Each file is validated
      # independently and only when steps.stage flagged it as staged
      # (staged_fc_seeds == '1' / staged_fc_failures == '1'). When a file
      # is NOT staged we still assert the documented fallback marker is
      # present, so the summary can never silently drop the section.
      #
      # The actual contract is enforced by .github/scripts/verify-fc-summary.sh
      # which dumps the relevant fc-* lines + the full body on failure for
      # easy CI debugging.
      - name: Verify fast-check inline links present in summary
        if: always() && steps.gate.outputs.should_run == 'true' && (matrix.id == 'request-method' || matrix.id == 'request-headers')
        id: verify_summary
        env:
          SUMMARY_FILE: ${{ steps.summary.outputs.summary_file }}
          CONTEXT_LABEL: summary-${{ matrix.id }}.md
          STAGED_FC_SEEDS: ${{ steps.stage.outputs.staged_fc_seeds }}
          STAGED_FC_FAILURES: ${{ steps.stage.outputs.staged_fc_failures }}
          FC_SEEDS_URL: ${{ steps.links.outputs.fc_seeds_url }}
          FC_FAILURES_URL: ${{ steps.links.outputs.fc_failures_url }}
          FC_HEADER_LABEL: ${{ matrix.id == 'request-method' && 'Access-Control-Request-Method' || 'Access-Control-Request-Headers' }}
          REQUIRE_CONTEXT_PARAGRAPH: '1'
        run: |
          chmod +x .github/scripts/verify-fc-summary.sh
          .github/scripts/verify-fc-summary.sh

      # Mirror validation for GITHUB_STEP_SUMMARY (Actions UI panel) — kept
      # inline because it targets a different file and is conditional on the
      # same staged_fc_* outputs.
      - name: Verify GITHUB_STEP_SUMMARY mirror (fast-check section)
        if: always() && steps.gate.outputs.should_run == 'true' && (matrix.id == 'request-method' || matrix.id == 'request-headers')
        env:
          STAGED_FC_SEEDS: ${{ steps.stage.outputs.staged_fc_seeds }}
          STAGED_FC_FAILURES: ${{ steps.stage.outputs.staged_fc_failures }}
          FC_SEEDS_URL: ${{ steps.links.outputs.fc_seeds_url }}
          FC_FAILURES_URL: ${{ steps.links.outputs.fc_failures_url }}
          FC_HEADER_LABEL: ${{ matrix.id == 'request-method' && 'Access-Control-Request-Method' || 'Access-Control-Request-Headers' }}
        run: |
          set -euo pipefail
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "${GITHUB_STEP_SUMMARY}" ] || {
            echo "::warning::GITHUB_STEP_SUMMARY unavailable; skipping mirror check"
            exit 0
          }

          fail_mirror() {
            echo "::error title=GITHUB_STEP_SUMMARY mirror violation::$1"
            echo "----- BEGIN GITHUB_STEP_SUMMARY fc-* lines -----"
            { grep -n -B 1 -A 1 -F "fc-seeds.json"    "${GITHUB_STEP_SUMMARY}" || true
              echo "---"
              grep -n -B 1 -A 1 -F "fc-failures.json" "${GITHUB_STEP_SUMMARY}" || true
            } | sed 's/^/  /'
            echo "----- END GITHUB_STEP_SUMMARY fc-* lines -----"
            exit 1
          }

          grep -Fq "🎯 fast-check direct downloads (${FC_HEADER_LABEL})" "${GITHUB_STEP_SUMMARY}" \
            || fail_mirror "Missing fast-check section for ${FC_HEADER_LABEL}"
          if [ "${STAGED_FC_SEEDS:-0}" = "1" ]; then
            grep -Fq "[fc-seeds.json](${FC_SEEDS_URL})" "${GITHUB_STEP_SUMMARY}" \
              || fail_mirror "Missing inline fc-seeds.json link (${FC_SEEDS_URL})"
          fi
          if [ "${STAGED_FC_FAILURES:-0}" = "1" ]; then
            grep -Fq "[fc-failures.json](${FC_FAILURES_URL})" "${GITHUB_STEP_SUMMARY}" \
              || fail_mirror "Missing inline fc-failures.json link (${FC_FAILURES_URL})"
          fi

          {
            echo ""
            echo "### ✅ Summary self-check (${FC_HEADER_LABEL})"
            echo "- \`summary-${CATEGORY_ID}.md\`: ${{ steps.verify_summary.outputs.seeds_result || 'validated' }}"
            echo "- \`fc-seeds.json\`:    ${{ steps.verify_summary.outputs.seeds_result || 'n/a' }}"
            echo "- \`fc-failures.json\`: ${{ steps.verify_summary.outputs.failures_result || 'n/a' }}"
            echo "- Body size: ${{ steps.verify_summary.outputs.size_bytes || 'n/a' }} bytes"
            echo "- Sticky PR comment source: OK"
          } >> "$GITHUB_STEP_SUMMARY"

      # Dedicated GitHub Check Run per category — visible as its own status
      # on PRs and commits, with details_url pointing at the category artifact.

      - name: Publish GitHub Check (${{ matrix.label }})
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ matrix.check_name }}
          conclusion: ${{ steps.fuzz.outputs.exit_code == '0' && 'success' || 'failure' }}
          details_url: ${{ steps.links.outputs.artifact_url }}
          output: |
            {
              "title": "${{ steps.fuzz.outputs.exit_code == '0' && format('✅ {0} — invariants held', matrix.label) || format('❌ {0} — invariant violation', matrix.label) }}",
              "summary": "Category: `${{ matrix.id }}`\nRun #${{ github.run_number }} on `${{ github.ref_name }}` (`${{ github.sha }}`).\n\n**Status:** ${{ steps.fuzz.outputs.exit_code == '0' && 'PASS' || 'FAIL' }}\n\n### 📦 Direct downloads\n- [📥 Full bundle (`${{ env.ARTIFACT_NAME }}`)](${{ steps.links.outputs.artifact_url }})${{ steps.links.outputs.seeds_url && format('\n- [🌱 `seeds.json`]({0})', steps.links.outputs.seeds_url) || '' }}${{ steps.links.outputs.failures_url && format('\n- [💥 `failures.json`]({0})', steps.links.outputs.failures_url) || '' }}${{ steps.links.outputs.log_url && format('\n- [📜 `fuzz-{0}.log`]({1})', matrix.id, steps.links.outputs.log_url) || '' }}${{ steps.links.outputs.fc_seeds_url && format('\n- [🌱 `fc-seeds.json` (fast-check)]({0})', steps.links.outputs.fc_seeds_url) || '' }}${{ steps.links.outputs.fc_failures_url && format('\n- [💥 `fc-failures.json` (fast-check minimized)]({0})', steps.links.outputs.fc_failures_url) || '' }}\n\n🔗 [Workflow run page](${{ steps.links.outputs.run_url }})"
            }

      # Validate the EXACT file that will be posted as the sticky PR comment
      # body (marocchino reads `path:` verbatim, so this file IS the sticky
      # body). Reuses .github/scripts/verify-fc-summary.sh, which dumps the
      # relevant fc-* lines + full body on failure for easy CI debugging.
      # Asserts are CONDITIONAL on staged_fc_seeds / staged_fc_failures.
      # For categories that don't run fast-check (e.g. origin) we skip the
      # script and only assert that the per-category direct-downloads block
      # exists. Runs only on pull_request because that's when the sticky
      # comment is actually posted.
      - name: Verify sticky PR comment body (fc-seeds/fc-failures contract)
        if: always() && steps.gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
        id: verify_sticky
        env:
          SUMMARY_FILE: ${{ steps.summary.outputs.summary_file }}
          CONTEXT_LABEL: sticky PR comment body (${{ matrix.sticky_header }})
          CATEGORY_ID: ${{ matrix.id }}
          STICKY_HEADER: ${{ matrix.sticky_header }}
          STAGED_FC_SEEDS: ${{ steps.stage.outputs.staged_fc_seeds }}
          STAGED_FC_FAILURES: ${{ steps.stage.outputs.staged_fc_failures }}
          FC_SEEDS_URL: ${{ steps.links.outputs.fc_seeds_url }}
          FC_FAILURES_URL: ${{ steps.links.outputs.fc_failures_url }}
          # Sticky body doesn't need the standalone-artifacts paragraph for
          # non-fast-check categories, but the script handles fc-categories.
          REQUIRE_CONTEXT_PARAGRAPH: '0'
        run: |
          set -euo pipefail

          if [ ! -s "${SUMMARY_FILE}" ]; then
            echo "::error title=Sticky body missing::${SUMMARY_FILE} not produced"
            exit 1
          fi

          # Categories that don't run fast-check → skip the fc-* script and
          # only assert the per-category direct-downloads block exists.
          if [ "${CATEGORY_ID}" != "request-method" ] && [ "${CATEGORY_ID}" != "request-headers" ]; then
            if ! grep -Fq "📦 Direct downloads for" "${SUMMARY_FILE}"; then
              echo "::error title=Sticky body contract violation (${STICKY_HEADER})::Missing per-category direct-downloads block"
              echo "----- BEGIN sticky body (${SUMMARY_FILE}) -----"
              sed -n '1,400p' "${SUMMARY_FILE}" || true
              echo "----- END sticky body -----"
              exit 1
            fi
            echo "✅ Sticky body for ${CATEGORY_ID} validated (no fast-check expected)."
            exit 0
          fi

          # fast-check categories → delegate to the shared verifier.
          chmod +x .github/scripts/verify-fc-summary.sh
          .github/scripts/verify-fc-summary.sh

          {
            echo ""
            echo "### 💬 Sticky PR comment self-check (${CATEGORY_ID})"
            echo "- Header: \`${STICKY_HEADER}\`"
            echo "- \`fc-seeds.json\`:    ${{ steps.verify_sticky.outputs.seeds_result || 'validated' }}"
            echo "- \`fc-failures.json\`: ${{ steps.verify_sticky.outputs.failures_result || 'validated' }}"
            echo "- Body size: ${{ steps.verify_sticky.outputs.size_bytes || 'n/a' }} bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      # Stage + upload summary-<category>.md as a standalone artifact so it
      # can be inspected in the GitHub Actions UI even when an upstream
      # `Verify ...` step (or any other step) failed. Runs with `if: always()`
      # so the file is preserved on failure as well as success.
      - name: Stage summary file for upload
        if: always() && steps.gate.outputs.should_run == 'true'
        id: stage_summary
        run: |
          mkdir -p reports/summary
          SRC="${{ steps.summary.outputs.summary_file }}"
          DEST="reports/summary/summary-${CATEGORY_ID}.md"
          if [ -f "${SRC}" ]; then
            cp "${SRC}" "${DEST}"
            echo "staged=1" >> "$GITHUB_OUTPUT"
            echo "Staged ${SRC} → ${DEST} ($(wc -c < "${DEST}") bytes)"
          else
            # Always emit a placeholder so the artifact upload doesn't get
            # skipped silently — easier to detect "summary never produced".
            echo "::warning title=summary-${CATEGORY_ID}.md missing::No summary file produced by step.summary at ${SRC}" >&2
            echo "(no summary file was produced by the summary step — see job logs)" > "${DEST}"
            echo "staged=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload summary-${{ matrix.id }}.md artifact
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preflight-fuzz-${{ matrix.id }}-summary-run${{ github.run_number }}-${{ github.run_id }}
          path: reports/summary/summary-${{ matrix.id }}.md
          if-no-files-found: warn
          retention-days: 14

      # Sticky PR comment per category (header is unique → no overwrites).
      - name: Comment on PR (${{ matrix.label }})
        if: always() && steps.gate.outputs.should_run == 'true' && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ matrix.sticky_header }}
          path: ${{ steps.summary.outputs.summary_file }}

  # Aggregate Check Run so a single required status can gate merges.
  preflight-fuzz-aggregate:
    name: Preflight CORS Fuzz / All
    needs: preflight-fuzz
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Compute aggregate conclusion
        id: agg
        run: |
          R='${{ needs.preflight-fuzz.result }}'
          if [ "$R" = "success" ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "title=✅ All preflight fuzz categories passed" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "title=❌ One or more preflight fuzz categories failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish aggregate Check
        uses: LouisBrunner/checks-action@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Preflight CORS Fuzz / All
          conclusion: ${{ steps.agg.outputs.conclusion }}
          details_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          output: |
            {
              "title": "${{ steps.agg.outputs.title }}",
              "summary": "Per-category Check Runs (each with its own artifacts):\n\n- **Preflight CORS Fuzz / Origin** → search GitHub Actions artifacts for `preflight-fuzz-origin-*-run${{ github.run_number }}-${{ github.run_id }}`\n- **Preflight CORS Fuzz / Request-Method** → search for `preflight-fuzz-request-method-*-run${{ github.run_number }}-${{ github.run_id }}` (includes `fc-seeds`/`fc-failures`)\n- **Preflight CORS Fuzz / Request-Headers** → search for `preflight-fuzz-request-headers-*-run${{ github.run_number }}-${{ github.run_id }}` (includes `fc-seeds`/`fc-failures`)\n\nNaming pattern: `preflight-fuzz-<category>-<file>-run<run_number>-<run_id>` (file ∈ `bundle`, `seeds`, `failures`, `log`, `fc-seeds`, `fc-failures`, `summary`).\n\nMatrix job result: `${{ needs.preflight-fuzz.result }}`.\n\n🔗 [Workflow run page](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            }
