name: Verify FC Summary Script

# Fast lint-style job that exercises .github/scripts/verify-fc-summary.sh
# against a fixture matrix (canonical bullets + drift cases). Runs on any
# change to either the verify script, its test harness, or this workflow,
# so contract drift between writer (preflight-fuzz.yml) and validator is
# caught BEFORE the full fuzz matrix burns minutes failing on the same issue.

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/verify-fc-summary.sh'
      - '.github/scripts/test-verify-fc-summary.sh'
      - '.github/scripts/test-artifacts-pagination.sh'
      - '.github/scripts/fixture-eol-fuzzer.sh'
      - '.github/workflows/verify-fc-summary.yml'
  pull_request:
    paths:
      - '.github/scripts/verify-fc-summary.sh'
      - '.github/scripts/test-verify-fc-summary.sh'
      - '.github/scripts/test-artifacts-pagination.sh'
      - '.github/scripts/fixture-eol-fuzzer.sh'
      - '.github/workflows/verify-fc-summary.yml'
      - '.github/workflows/preflight-fuzz.yml'  # writer side — keep in sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-fc-summary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: verify-fc-summary smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verify-fc-summary smoke tests
        run: |
          chmod +x .github/scripts/verify-fc-summary.sh \
                   .github/scripts/test-verify-fc-summary.sh
          bash .github/scripts/test-verify-fc-summary.sh

      - name: Run artifacts pagination harness
        run: |
          chmod +x .github/scripts/test-artifacts-pagination.sh
          bash .github/scripts/test-artifacts-pagination.sh

      - name: Parser unit tests (EOL fuzzer)
        run: |
          chmod +x .github/scripts/fixture-eol-fuzzer.sh
          bash .github/scripts/fixture-eol-fuzzer.sh test-parser

      - name: Random EOL fuzz — deterministic baseline (300 iters, seed=1)
        run: bash .github/scripts/fixture-eol-fuzzer.sh fuzz --iters 300 --seed 1

      - name: Random EOL fuzz — extended seed sweep (500 iters, seed=10000)
        run: bash .github/scripts/fixture-eol-fuzzer.sh fuzz --iters 500 --seed 10000

      - name: Random EOL fuzz — non-deterministic seed (250 iters, run-id derived)
        # Varia a seed por execução do CI usando GITHUB_RUN_ID + RUN_ATTEMPT,
        # garantindo que PRs distintos exercitem combinações de EOL diferentes
        # ao longo do tempo (cobertura cumulativa entre runs).
        run: |
          SEED=$(( (GITHUB_RUN_ID + GITHUB_RUN_ATTEMPT * 7919) % 2147483647 ))
          echo "Using non-deterministic seed: ${SEED}"
          bash .github/scripts/fixture-eol-fuzzer.sh fuzz --iters 250 --seed "${SEED}"

